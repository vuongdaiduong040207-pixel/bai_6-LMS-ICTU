<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sell Phone</title>
    <link rel="stylesheet" href="style_phone.css" />
  </head>
  <body>
    <header>
      <img class="img_phone" src="logo.phone.png" alt="logo điện thoại" />
      <div>
        <div><span>Phone parts</span></div>
        <div><span>Linh kiện điện thoại chính hãng</span></div>
      </div>
      <a href="#">SẢN PHẨM</a>
      <a href="#">LINH KIỆN</a>
      <a href="#">KHUYẾN MÃI</a>
      <a href="#">TIN TỨC</a>
      <div>
        <input type="search" placeholder="🔍 Tìm linh kiện" />
      </div>
    </header>
    <main>
      <img
        class="marketing_image"
        src="marketing_phone.jpg"
        alt="marketing phone image"
      />
      <div>
        <section>
          <div><img class="iphone" src="iphone_5.jpg" alt="" /></div>
          <hr />
          <br />
          <p class="p_strong">Iphone 5 cũ kỉ niệm</p>
          <br />
          <p class="opacity">16GB</p>
          <br />
          <a href="#"><b>500.000đ</b></a
          ><s>1.000.000đ</s>
          <br />
          <br />
          <input type="submit" value="Mua ngay" />
          <input type="submit" value="Giỏ hàng" />
        </section>
        <section>
          <div><img class="iphone" src="iPhone-17promax.jpg" alt="" /></div>
          <hr />
          <br />
          <p class="p_strong">Iphone 17 pro max mới ra mắt nha cả nhà mình</p>
          <br />
          <p class="opacity">256GB</p>
          <br />
          <a href="https://www.thegioididong.com/cart"><b>34.590.000đ</b></a
          ><s>32.590.000đ</s>
          <br />
          <br />
          <input type="submit" value="Mua ngay" />
          <input type="submit" value="Giỏ hàng" />
        </section>
        <section>
          <div><img class="iphone" src="iphone-18_promax.jpg" alt="" /></div>
          <hr />
          <br />
          <p class="p_strong">Iphone 18 siêu phẩm đây rồi</p>
          <br />
          <p class="opacity">2T GB</p>
          <br />
          <a href="#"><b>62.000.000đ</b></a
          ><s>67.000.000đ</s>
          <br />
          <br />
          <input type="submit" value="Mua ngay" />
          <input type="submit" value="Giỏ hàng" />
        </section>
      </div>
    </main>
  </body>
</html>
